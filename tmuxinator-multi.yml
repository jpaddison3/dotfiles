# ~/.tmuxinator/dev.yml
name: <%= ENV['TMUX_SESSION'] || 'dev' %>
root: ~/
windows:
  - 80k:
      layout: even-vertical
      root: ~/80k/advisorbot/<%= ENV['MINERVA_DIR'] || 'minerva' %>
      panes:
        -
        -
  - 80k-other:
      layout: even-vertical
      root: ~/80k
      panes:
        -
        -
  - ai-products-research:
      layout: even-vertical
      root: ~/80k
      panes:
        -
        -
  - repl:
      layout: even-horizontal
      root: ~
      panes:
        - py3 && ipython
        - node
  - personal:
      layout: even-vertical
      root: ~/personal-coding
      panes:
        -
        - cd ../Documents/dotfiles
  - misc:
      layout: even-vertical
      root: ~
      panes:
        -
        -
